name: Build Android APK

# 暂时搁置：APK 启动还会闪退，先不折腾了。
# 因此这里只在手动点击时才会跑（去掉 push tag 自动触发，避免打 tag 时白跑一次）。
# 想重新折腾时，直接 Run workflow 即可，或把这个工作流/整个 android/ 目录删掉。
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "桌面显示名"
        required: false
        default: "Phira Mod"

permissions:
  contents: read

# 同一分支/标签重复触发时自动取消旧的一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHIRA_ANDROID_ABI: arm64-v8a
  ANDROID_TRIPLE: aarch64-linux-android
  PRPR_AVC_FFMPEG_VERSION: 20260309_v0

jobs:
  apk:
    name: Build APK (arm64-v8a)
    # Android 构建在 ubuntu 上是 1 倍计费，比 iOS 便宜很多
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # local-maven 下 vendored 的 rustls-platform-verifier AAR 版本必须和 Cargo.lock 锁定的
      # rustls-platform-verifier-android 一致，否则 Rust 侧 TLS 证书校验会直接失败
      # （表现：登录页一直报「获取服务条款和隐私政策内容失败」），而且编译期毫无提示。
      - name: Verify vendored rustls-platform-verifier AAR version
        run: |
          set -euo pipefail
          LOCKED=$(awk '/^name = "rustls-platform-verifier-android"/{getline; print}' Cargo.lock | sed -E 's/.*"(.*)".*/\1/')
          VENDORED=$(ls android/local-maven/rustls/rustls-platform-verifier)
          echo "Cargo.lock=$LOCKED  vendored=$VENDORED"
          if [ "$LOCKED" != "$VENDORED" ]; then
            echo "::error::vendored 的 AAR 版本($VENDORED)与 Cargo.lock($LOCKED)不一致：把 ~/.cargo/registry/src/*/rustls-platform-verifier-android-$LOCKED/maven/rustls 复制到 android/local-maven/，并同步修改 app/build.gradle 里的版本号"
            exit 1
          fi
          test -f "android/local-maven/rustls/rustls-platform-verifier/$VENDORED/rustls-platform-verifier-$VENDORED.aar"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ⚠️ 不要用 `android-actions/setup-android@v3`：
      # 它内部固定执行一次 `sdkmanager tools`，而 **Google 已经把旧版 `tools` 包从 SDK 仓库移除**，
      # 于是报 `Warning: Failed to find package 'tools'` 并 exit 1，整个 job 在最前面就挂掉：
      #   https://github.com/android-actions/setup-android/issues  （tools 包被移除）
      #
      # ubuntu runner 镜像**本来就预装了** Android SDK / cmdline-tools / NDK / platform-tools，
      # 所以这里只补环境变量 + 兜底接受一次协议即可（`android-inspect.yml` 也是这么用的）。
      - name: Setup Android SDK (use preinstalled)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::找不到预装的 sdkmanager：$SDKMANAGER"
            ls -d "$SDK"/cmdline-tools/* 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # 预装的包协议通常已经接受过；这里用 yes 兜底把剩下的也接受掉（交互式，必须灌输入）
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "sdk        : $SDK"
          echo "cmdline-tools: $("$SDKMANAGER" --version 2>/dev/null | tail -n1)"
          echo "ndk(latest): ${ANDROID_NDK_LATEST_HOME:-（镜像没设，后面会自己装）}"

      - name: Setup Android NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "runner 上没有预装 NDK，用 sdkmanager 装一个"
            sdkmanager --install "ndk;26.1.10909125" >/dev/null
            NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          fi
          test -d "$NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ndk: $NDK"

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ env.ANDROID_TRIPLE }}
          rustup show

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: "true"

      # assets/font.ttf 与 background.jpg 都被 .gitignore 忽略（font.ttf 是 git add -f 进去的，
      # 仍然很脆）；缺任何一个运行时都会直接启动失败。这里统一兜底：
      # 先看仓库里有没有，缺了就从官方 APK 提取，再不行从官方地址取，最后才用占位图。
      - name: Prepare runtime assets (font.ttf / background.jpg)
        run: |
          set -euo pipefail
          # 官方 APK 只是拿来提取资源，绝不能留到 artifact 里
          trap 'rm -f official.apk' EXIT
          MISSING=""
          [ -f assets/background.jpg ] || MISSING="$MISSING background.jpg"
          [ -f assets/font.ttf ] || MISSING="$MISSING font.ttf"
          if [ -n "$MISSING" ]; then
            echo "仓库里缺少:$MISSING，尝试从官方 APK 提取"
            APK_URL=$(curl -fsSL --connect-timeout 10 --max-time 90 \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/TeamFlos/phira/releases/latest \
              | grep -oE '"browser_download_url":[[:space:]]*"[^"]+\.apk"' \
              | head -n1 | sed -E 's/.*"(https:[^"]+)".*/\1/' || true)
            if [ -n "${APK_URL:-}" ] && curl -fL --retry 3 --connect-timeout 10 --max-time 300 -o official.apk "$APK_URL"; then
              for f in $MISSING; do
                ENTRY=$(unzip -Z1 official.apk | grep -iE "(^|/)$f\$" | head -n1 || true)
                if [ -n "${ENTRY:-}" ]; then
                  unzip -o -j official.apk "$ENTRY" -d assets
                  echo "extracted $ENTRY"
                fi
              done
            fi
          fi
          if [ ! -f assets/font.ttf ]; then
            echo "font.ttf 仍未取到，试官方地址"
            curl -fL --retry 3 --connect-timeout 10 --max-time 180 -o assets/font.ttf https://mivik.moe/prpr/font.ttf || true
          fi
          if [ ! -f assets/background.jpg ]; then
            echo "::warning::assets/background.jpg 缺失，用 assets/abstract.jpg 顶替"
            cp assets/abstract.jpg assets/background.jpg
          fi
          # 缺 font.ttf 时直接失败，不要产出一个装了就崩的包
          test -f assets/font.ttf
          test -f assets/background.jpg
          ls -lh assets/background.jpg assets/font.ttf
          # 第 9 章噪域（红区）的官方 Phigros 贴图。官方 Phigros 包 3.3 GB，不适合在 CI 里
          # 现取（Phira 官方包才 42 MB，所以上面那两个能现取），这里只提示不失败：
          # 缺了噪域会降级成一块纯红矩形，见 开源步骤.md §1.1.1。
          if [ ! -d assets/blockarea ]; then
            echo "::warning::assets/blockarea/ 缺失：第 9 章噪域会降级成纯红矩形"
          fi

      # 签名的 keystore 第一次生成后缓存起来，这样后续构建签名一致、可以直接覆盖安装
      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: android/keystore.jks
          key: phira-mod-keystore-v1

      - name: Create signing keystore if missing
        run: |
          set -euo pipefail
          if [ ! -f android/keystore.jks ]; then
            echo "生成新的签名 keystore（首次构建）"
            keytool -genkeypair -v \
              -keystore android/keystore.jks \
              -storetype PKCS12 \
              -storepass phiramod \
              -keypass phiramod \
              -alias phiramod \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Phira Mod, OU=Mod, O=PhiCraft, L=-, ST=-, C=CN"
          fi
          keytool -list -keystore android/keystore.jks -storepass phiramod > /dev/null
          echo "keystore 就绪"

      - name: Build Rust library (libphira.so)
        run: |
          set -euo pipefail
          # video 功能需要 FFmpeg 静态库（上游的 iOS 包是坏的），这里同样用
          # --no-default-features 关掉 video。界面全部走 Rust 原生 UI（WebView 已移除）。
          cargo ndk -t ${{ env.PHIRA_ANDROID_ABI }} -o android/app/src/main/jniLibs \
            build --release -p phira --no-default-features
          JNI="android/app/src/main/jniLibs/${{ env.PHIRA_ANDROID_ABI }}"
          ls -lh "$JNI/"
          file "$JNI/libphira.so"

          echo "--- libphira.so 依赖的动态库 ---"
          readelf -d "$JNI/libphira.so" | grep -E 'NEEDED|SONAME' || true

          # oboe（sasa 的音频后端）是 C++ 写的，通常会依赖 libc++_shared.so；
          # 缺了它 dlopen 会失败 -> 应用启动即闪退。这里无条件把它一起放进 APK。
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          if [ -f "$SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" ]; then
            cp "$SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI/"
            echo "已一并打包 libc++_shared.so"
          else
            echo "::warning::NDK 里找不到 libc++_shared.so（$SYSROOT）"
          fi
          ls -lh "$JNI/"

          # 校验：JNI 符号必须真的在 .so 里（链接器有可能把依赖 crate 的符号裁掉）
          echo "--- 导出的 JNI 符号 ---"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only "$JNI/libphira.so" 2>/dev/null | grep -E 'Java_quad_1native|JNI_OnLoad|quad_main' | head -n 30 \
            || nm -D --defined-only "$JNI/libphira.so" | grep -E 'Java_quad_1native|JNI_OnLoad|quad_main' | head -n 30 \
            || echo "::warning::没找到 JNI 符号，可能需要给 Rust 加 -Wl,--export-dynamic"
          echo "--- 期望存在的关键符号计数（应 >= 13 个 miniquad 回调 + phira 自己的）---"
          "$NM" -D --defined-only "$JNI/libphira.so" 2>/dev/null | grep -c 'Java_quad_1native' || true

      - name: Copy game assets into the APK project
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r assets/. android/app/src/main/assets/
          # 不要把仓库里的大目录也塞进去
          rm -rf android/app/src/main/assets/dist android/app/src/main/assets/res
          du -sh android/app/src/main/assets
          ls android/app/src/main/assets | head -n 30

      - name: Apply app name
        run: |
          set -euo pipefail
          NAME="${{ inputs.app_name || 'Phira Mod' }}"
          python3 - "$NAME" <<'PY'
          import re, sys, pathlib
          name = sys.argv[1]
          p = pathlib.Path("android/app/src/main/res/values/strings.xml")
          text = p.read_text(encoding="utf-8")
          text = re.sub(r'(<string name="app_name">).*?(</string>)', lambda m: m.group(1) + name + m.group(2), text)
          p.write_text(text, encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          set -euo pipefail
          gradle -p android assembleRelease --no-daemon
          find android/app/build/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Collect APK
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          cp "$APK" "Phira-$VERSION-mod.apk"
          ls -lh "Phira-$VERSION-mod.apk"
          echo "APK=$PWD/Phira-$VERSION-mod.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phira-apk
          # 只收我们自己的产物：仓库根目录可能残留 official.apk（下载官方包提取资源时留下的）
          path: "Phira-*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### APK 构建完成 :tada:"
            echo ""
            echo "- 产物：\`$(basename "$APK")\`"
            echo "- 包名：\`org.flos.phira.modded\`（与官方 org.flos.phira 不同，可与官方版共存）"
            echo "- ABI：arm64-v8a（现代 64 位安卓设备）"
            echo "- 使用仓库内置 keystore 签名，后续版本可直接覆盖安装"
            echo ""
            ls -lh *.apk || true
          } >> "$GITHUB_STEP_SUMMARY"
